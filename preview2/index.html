<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>[刷新案] 年収UPシミュレーター</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   刷新案（構造から作り替え）

   現行の問題:
   ・4問を1画面に並べた「申込書」形式。診断ではなく事務作業に見える
   ・結果が「数字ひとつ + ゲージ」で、知りたい「自分はどの位置か」が見えない
   ・クリーム×明朝×テラコッタは、AIが最も作りがちな配色そのもの

   この案:
   ・1問1画面のステップ形式。押すだけで進む。診断コンテンツの標準形
   ・結果は「同業種・同年代の分布の中の自分の位置」を主役にする
   ・配色は深緑×山吹。日本のお金まわりの色で、AI既定の型から外す
   =========================================================================== */
  :root{
    --bg:#FBFAF6;
    --card:#FFFFFF;
    --ink:#12211D;
    --ink-2:#4B5B55;
    --line:#DFE4E0;
    --green:#0B5D51;
    --green-d:#084A40;
    --gold:#D9922B;
    --gold-d:#B4761C;
    --danger:#B3402C;
    --r:16px;      /* 外側の器は大きく */
    --r-in:8px;    /* 内側の部品は小さく。丸みを揃えないことで階層を出す */
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:
    radial-gradient(120% 60% at 50% 0%, #F2F7F4 0%, rgba(242,247,244,0) 60%),
    var(--bg);
    color:var(--ink);
       font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
       line-height:1.7;-webkit-font-smoothing:antialiased;
       font-feature-settings:"palt";}
  .pvbar{background:var(--ink);color:#EAF2EF;font-size:12.5px;padding:8px 14px;text-align:center}
  .pvbar a{color:#8FD2C4}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 64px}

  /* ── ステップ ───────────────────────────── */
  .stage{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding:26px 0 24px}
  .brand{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--green);margin-bottom:30px}
  .qnum{font-size:12px;font-weight:700;color:var(--gold-d);letter-spacing:.1em;margin-bottom:10px}
  .q{font-size:clamp(24px,6.6vw,32px);font-weight:900;line-height:1.35;letter-spacing:-.01em;
     margin:0 0 6px;text-wrap:balance}
  .qsub{font-size:14px;color:var(--ink-2);margin:0 0 22px}
  .opts{display:grid;gap:10px}
  .opt{appearance:none;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
       border-radius:var(--r-in);border-left:4px solid transparent;padding:17px 18px;font:inherit;font-weight:700;font-size:16.5px;color:var(--ink);
       cursor:pointer;transition:transform .16s var(--ease),border-color .16s,box-shadow .16s;
       display:flex;align-items:center;justify-content:space-between;gap:10px}
  .opt:hover{border-color:var(--line);border-left-color:var(--green);transform:translateY(-1px);
            box-shadow:0 6px 18px rgba(11,93,81,.10)}
  .opt:active{transform:scale(.988)}
  .opt::after{content:"→";color:var(--green);font-weight:900;opacity:.35;transition:opacity .16s,transform .16s}
  .opt:hover::after{opacity:1;transform:translateX(2px)}
  .opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .opt .sub{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-top:2px}
  .prog{display:flex;gap:6px;margin-top:auto;padding-top:26px}
  .prog i{height:3px;flex:1;background:var(--line);border-radius:2px;transition:background .3s}
  .prog i.on{background:var(--green)}
  .back{margin-top:14px;background:none;border:none;color:var(--ink-2);font:inherit;font-size:13.5px;
        cursor:pointer;padding:6px 0;text-align:left}
  .back:hover{color:var(--green)}
  .lede{font-size:14.5px;color:var(--ink-2);margin:0 0 26px;max-width:30em}
  .pr{font-size:11.5px;color:var(--ink-2);opacity:.75;margin-top:20px}

  /* イラスト。この題材の主役は人物ではなく分布なので、
     ストック写真ではなく「棒グラフの上に人が並び、自分の位置が分かる」絵を描いた。
     題材そのものを絵にしているので、他所から持ってきた写真より説明力がある。 */
  .hero-art{display:block;width:100%;height:auto;margin:0 0 20px;
            filter:drop-shadow(0 10px 24px rgba(11,93,81,.13))}

  /* ── 開始画面 ───────────────────────────────
     競合(doda/ビズリーチ/パソナ)は全社がヒーローに絵とスタートボタンを置いている。
     こちらは文字だけで引きが弱く、しかも何が始まるのか分からないまま
     いきなりQ1が出ていた。導入を1枚挟む。
     写真は使わない。この題材の主役は人物ではなく数字と分布なので、
     「診断するとこれが出る」を結果画面のミニプレビューで見せる。 */
  #intro{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding:26px 0 24px}
  .h-lead{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--green);margin-bottom:14px}
  .h-ttl{font-size:clamp(27px,7.6vw,36px);font-weight:900;line-height:1.34;letter-spacing:-.015em;
         margin:0 0 12px;text-wrap:balance}
  .h-ttl em{font-style:normal;color:var(--green)}
  .h-sub{font-size:14.5px;color:var(--ink-2);margin:0 0 16px;max-width:29em}
  .facts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
  .fact{font-size:13px;font-weight:800;color:var(--green);background:#EAF2EF;
        border-radius:7px;padding:6px 12px;letter-spacing:.01em}
  /* 結果のミニプレビュー: 何が得られるかを先に見せる */
  .peek{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
        padding:16px 16px 14px;margin-bottom:20px;overflow:hidden}
  .peek::after{content:"診断すると、こう出ます";position:absolute;right:12px;top:12px;
        font-size:10.5px;font-weight:700;color:var(--ink-2);background:var(--bg);
        border:1px solid var(--line);border-radius:5px;padding:3px 7px}
  .peek .pk-amt{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
  .peek .pk-amt em{font-style:normal;color:var(--green)}
  .peek .pk-bars{display:flex;align-items:flex-end;gap:4px;height:52px;margin-bottom:5px}
  .peek .pk-bars i{flex:1;background:#E7EDEA;border-radius:3px 3px 0 0}
  .peek .pk-bars i.me{background:var(--green);position:relative}
  .peek .pk-bars i.me::after{content:"あなた";position:absolute;left:50%;top:-17px;transform:translateX(-50%);
        font-size:9.5px;font-weight:900;color:var(--green);white-space:nowrap}
  .peek .pk-ax{font-size:9.5px;color:var(--ink-2);text-align:center}
  .vs{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);
      border-radius:9px;padding:13px 15px;margin-bottom:22px;font-size:13.5px;color:var(--ink-2);line-height:1.72}
  .vs b{color:var(--ink)}
  .start{width:100%;min-height:58px;background:var(--green);color:#fff;border:none;border-radius:11px;
         font:inherit;font-size:17.5px;font-weight:900;letter-spacing:.02em;cursor:pointer;
         box-shadow:0 6px 18px rgba(11,93,81,.22);transition:transform .14s var(--ease),background .18s}
  .start:hover{background:#08483F}
  .start:active{transform:scale(.988)}
  .start:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  /* ── 結果 ───────────────────────────────── */
  #result{display:none;padding:26px 0 0}
  #result.on{display:block;animation:up .5s var(--ease) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .verdict{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--gold-d);margin-bottom:6px}
  .big{font-size:clamp(30px,8.4vw,42px);font-weight:900;line-height:1.28;letter-spacing:-.02em;margin:0 0 18px;text-wrap:balance}
  .big em{font-style:normal;color:var(--green)}
  .big .amt{font-size:1.5em;letter-spacing:-.03em}

  /* 分布グラフ: 知りたいのは「自分がどこにいるか」なのでこれを主役に置く */
  .dist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 16px;margin-bottom:14px}
  .dist h2{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 16px;letter-spacing:.02em}
  .bars{display:flex;align-items:flex-end;gap:5px;height:104px;margin-bottom:6px}
  .bars .b{flex:1;background:#E7EDEA;border-radius:4px 4px 0 0;position:relative;transition:height .8s var(--ease)}
  .bars .b.me{background:var(--green)}
  .bars .b.me::after{content:"あなた";position:absolute;left:50%;top:-22px;transform:translateX(-50%);
    font-size:11px;font-weight:900;color:var(--green);white-space:nowrap}
  .axis{display:flex;gap:5px;font-size:10.5px;color:var(--ink-2)}
  .axis span{flex:1;text-align:center}
  .dnote{font-size:12.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-in);padding:14px 15px}
  .kpi dt{font-size:11.5px;color:var(--ink-2);margin-bottom:2px}
  .kpi dd{margin:0;font-size:23px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .kpi.up dd{color:var(--gold-d)}
  .kpi.ok dd{color:var(--green);font-size:19px}

  .sec-h{font-size:17px;font-weight:900;margin:26px 0 4px;letter-spacing:-.01em}
  .sec-s{font-size:13px;color:var(--ink-2);margin:0 0 14px}
  .svc{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:11px;
       transition:border-color .18s,box-shadow .18s}
  .svc:hover{border-color:var(--green);box-shadow:0 8px 24px rgba(11,93,81,.10)}
  .svc.first{border-color:var(--green);border-width:2px}
  .svc-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .svc-rank{flex:0 0 auto;font-size:11px;font-weight:900;color:#fff;background:var(--ink-2);
            border-radius:5px;padding:3px 8px;letter-spacing:.04em}
  .svc.first .svc-rank{background:var(--green)}
  .svc h3{margin:0;font-size:17.5px;font-weight:900;letter-spacing:-.01em}
  .svc p{margin:0 0 14px;font-size:13.5px;color:var(--ink-2)}
  .svc a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;
         background:var(--gold);color:#231a09;font-weight:900;font-size:15.5px;text-decoration:none;
         border-radius:var(--r-in);transition:background .18s,transform .12s}
  .svc a:hover{background:var(--gold-d);color:#fff}
  .svc a:active{transform:scale(.99)}
  .svc.first a{background:var(--green);color:#fff}
  .svc.first a:hover{background:#08483F}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:18px;
         font-size:13.5px;color:var(--ink-2)}

  .share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .share span{font-size:12.5px;color:var(--ink-2)}
  .share button{font:inherit;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--card);
                border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;transition:.16s}
  .share button:hover{border-color:var(--green);color:var(--green)}
  .again{margin-top:18px;width:100%;min-height:46px;background:none;border:1.5px solid var(--line);
         border-radius:9px;font:inherit;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.16s}
  .again:hover{border-color:var(--green);color:var(--green)}
  .fine{font-size:11.5px;color:var(--ink-2);opacity:.8;margin-top:22px;line-height:1.75}
  .foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
  .foot a{color:var(--green)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pvbar">刷新案のプレビューです（現行は <a href="https://clawtech6477.github.io/nenshu-shindan/">こちら</a>）</div>
<div class="wrap">

  <!-- 開始画面 -->
  <section id="intro">
    <div class="h-lead">SALARY CHECK</div>
    <h1 class="h-ttl">その年収、<em>あと何万円</em><br>上げられる？</h1>
    <p class="h-sub">同業種・同年代の水準と比べて、あなたがいまどの位置にいるかを出します。</p>
    <div class="facts">
      <span class="fact">質問は4つ</span>
      <span class="fact">30秒</span>
      <span class="fact">登録なし</span>
      <span class="fact">無料</span>
    </div>

    <svg class="hero-art" viewBox="0 0 340 176" role="img"
         aria-label="同業種・同年代の年収分布を表す棒グラフの上に人が並び、自分の位置が示されているイラスト">
      <defs>
        <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#DCE7E2"/><stop offset="1" stop-color="#EDF2EF"/>
        </linearGradient>
        <linearGradient id="gMe" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0F6C5E"/><stop offset="1" stop-color="#0B5D51"/>
        </linearGradient>
        <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F3F7F5"/><stop offset="1" stop-color="#FBFAF6"/>
        </linearGradient>
        <!-- 平坦さを消すための微細なノイズ。ベタ塗りのままだと画面が死ぬ -->
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer></filter>
      </defs>
    
      <rect width="340" height="176" rx="14" fill="url(#gSky)"/>
      <rect width="340" height="176" rx="14" filter="url(#grain)" opacity=".7"/>
    
      <!-- 分布の棒。左右に裾があり中央が高い -->
      <g>
        <rect x="18"  y="128" width="42" height="30" rx="5" fill="url(#gBar)"/>
        <rect x="68"  y="104" width="42" height="54" rx="5" fill="url(#gBar)"/>
        <rect x="118" y="76"  width="42" height="82" rx="5" fill="url(#gMe)"/>
        <rect x="168" y="92"  width="42" height="66" rx="5" fill="url(#gBar)"/>
        <rect x="218" y="116" width="42" height="42" rx="5" fill="url(#gBar)"/>
        <rect x="268" y="136" width="42" height="22" rx="5" fill="url(#gBar)"/>
      </g>
      <rect x="10" y="158" width="320" height="2.5" rx="1.25" fill="#CFDAD5"/>
    
      <!-- 人。棒の上に立っていて、真ん中が「あなた」 -->
      <g fill="#B9C7C1">
        <g><circle cx="39" cy="112" r="7"/><path d="M31 128a8 8 0 0 1 16 0z"/></g>
        <g><circle cx="89" cy="88" r="7"/><path d="M81 104a8 8 0 0 1 16 0z"/></g>
        <g><circle cx="189" cy="76" r="7"/><path d="M181 92a8 8 0 0 1 16 0z"/></g>
        <g><circle cx="239" cy="100" r="7"/><path d="M231 116a8 8 0 0 1 16 0z"/></g>
        <g><circle cx="289" cy="120" r="7"/><path d="M281 136a8 8 0 0 1 16 0z"/></g>
      </g>
    
      <!-- あなた -->
      <g>
        <circle cx="139" cy="57" r="8.5" fill="#0B5D51"/>
        <path d="M129.5 76a9.5 9.5 0 0 1 19 0z" fill="#0B5D51"/>
        <g transform="translate(139,34)">
          <rect x="-25" y="-13" width="50" height="21" rx="10.5" fill="#D9922B"/>
          <path d="M-4 8 L0 13 L4 8 Z" fill="#D9922B"/>
          <text x="0" y="2.5" text-anchor="middle" font-size="11" font-weight="900"
                font-family="'Zen Kaku Gothic New',sans-serif" fill="#2A1B04">あなた</text>
        </g>
      </g>
    </svg>

    <div class="vs">
      大手の年収診断は、たいてい<b>その会社のサービスへの入口</b>です。<br>
      ここはどこにも属していないので、<b>あなたの業種と希望に合うところを選んで</b>お出しします。
    </div>

    <button class="start" id="start">診断をはじめる</button>
    <p class="pr" style="margin-top:auto;padding-top:22px">[PR] 本ページはアフィリエイト広告を含みます</p>
  </section>

  <!-- ステップ -->
  <section class="stage" id="stage" style="display:none">
    <div class="brand">SALARY CHECK</div>
    <div id="qbox"></div>
    <div class="prog" id="prog"></div>
    <button class="back" id="back" style="display:none">← ひとつ戻る</button>
  </section>

  <!-- 結果 -->
  <section id="result"></section>
</div>
<script>
const AFFILIATE_URLS = {
  recruit:     "#recruit",     // s00000011454002 リクルートエージェント(新規WEBエントリー後初回受付¥2,000)

  zeroichi:    "#zeroichi",    // s00000023866002 ゼロイチ転職(新規面談¥15,000)
  gks:         "#gks",         // s00000022176005 GKSキャリア(新規面談実施¥25,000)
  buildjob:    "https://px.a8.net/svt/ejp?a8mat=4B8DGQ+C5LMEQ+5B0Y+NTJWY", // s00000024757004 ビルドジョブ 提携承認済み(2026/08/07)
  rsg:         "#rsg",         // s00000021947004 RSG不動産転職(新規カウンセリング¥3,000)
  keirijobs:   "#keirijobs",   // s00000026359002 経理Jobs(新規転職支援申込¥10,000)
  twinpro:     "https://px.a8.net/svt/ejp?a8mat=4B8DGQ+C6720I+5B0Y+BWVTE", // s00000024757002 ツインプロ 提携承認済み(2026/07/31)
  nursesenka:  "#nursesenka",  // s00000001248024 ナース専科 転職(新規申込¥26,000)
  pharmastaff: "#pharmastaff", // s00000010261001 ファルマスタッフ(新規会員登録¥65,000)
  kaigobatake: "https://px.a8.net/svt/ejp?a8mat=4B9VHD+8GTYIA+1W34+C0B9U", // s00000008824002 かいご畑 提携承認済み(2026/08/07)
  kaigotown:   "#kaigotown",   // s00000027480001 介護タウン(新規面談実施¥10,000) 申込2026/08/01
};

const JOB_LABEL = {it:"IT・Web",sales:"営業",acct:"事務・経理",nurse:"看護師",pharma:"薬剤師",care:"介護・福祉",constr:"建設・不動産",maker:"製造",service:"販売・サービス",childcare:"保育",other:"その他"};

const DIR_LABEL = {same:"同業種で年収UP",toit:"IT・コンサルへ挑戦",new:"未経験の職種へ",wlb:"働き方重視",unsure:"方向性を模索中"};

const BASE = {it:520,sales:450,acct:390,nurse:480,pharma:560,care:360,constr:455,maker:440,service:360,childcare:340,other:478};

/* ── 質問（1問1画面） ───────────────────────── */

   opts:[["20","20〜30歳"],["30","31〜40歳"],["40","41〜50歳"],["50","51歳以上"]]},
  {key:"income", q:"いまの年収は？", sub:"だいたいで大丈夫です",
   opts:[["250","〜300万円"],["350","300〜400万円"],["450","400〜500万円"],
         ["600","500〜700万円"],["850","700〜1000万円"],["1100","1000万円〜"]]},
  {key:"job", q:"いまの業種は？", sub:"いちばん近いものを選んでください",
   opts:[["it","IT・Web"],["sales","営業"],["acct","事務・経理"],["nurse","看護師"],
         ["pharma","薬剤師"],["care","介護・福祉"],["constr","建設・不動産"],["maker","製造"],
         ["service","販売・サービス"],["childcare","保育"],["other","その他"]]},
  {key:"dir", q:"これから、どうしたい？", sub:"いちばん近い気持ちで構いません",

         ["new","未経験の職種に移りたい"],["wlb","働き方を変えたい"],["unsure","まだ迷っている"]]},

const st={}; let step=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function track(ev,p){ if(typeof gtag==="function") gtag("event",ev,p||{}); }

function renderStep(){
  const Q=QS[step];
  $("qbox").innerHTML =
    `<div class="qnum">Q${step+1} / ${QS.length}</div>
     <h1 class="q">${esc(Q.q)}</h1>
     <p class="qsub">${esc(Q.sub)}</p>
     <div class="opts">${Q.opts.map(([v,l])=>
       `<button class="opt" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div>`;
  $("qbox").querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{
      st[Q.key]=b.dataset.v;
      step++;
      if(step<QS.length){ renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }
      else show();
    };
  });
  $("prog").innerHTML = QS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join("");
  $("back").style.display = step>0 ? "" : "none";
}
$("back").onclick=()=>{ if(step>0){ step--; renderStep(); } };

/* ── 結果 ───────────────────────────────── */
function show(){
  const ageK={20:1.0,30:1.15,40:1.2,50:1.1}[st.age];
  const dirK=st.dir==="toit"?1.2:st.dir==="new"?1.1:1.0;
  const cur=+st.income;
  const fit=Math.round(BASE[st.job]*ageK*dirK/10)*10;
  const above=fit<=cur, diff=above?0:fit-cur;

  // 同業種・同年代の分布を作り、その中の自分の位置を示す。
  // 知りたいのは「いくら」より「自分はどのあたりか」なので、これを結果の主役にする。
  const bands=[[0,300,"〜300"],[300,400,"300〜400"],[400,500,"400〜500"],
               [500,700,"500〜700"],[700,1000,"700〜1000"],[1000,9999,"1000〜"]];
  const center=fit;
  const heights=bands.map(([lo,hi])=>{
    const mid=(lo+Math.min(hi,1300))/2;
    return Math.exp(-Math.pow((mid-center)/230,2))*100+6;   // 中心=適正年収の正規分布
  });
  const myIdx=bands.findIndex(([lo,hi])=>cur>=lo&&cur<hi);
  const pct=Math.round(heights.slice(0,Math.max(myIdx,0)).reduce((a,b)=>a+b,0)/heights.reduce((a,b)=>a+b,0)*100);

  const sites=pick(cur);
  $("result").innerHTML=`
    <div class="verdict">${above?"診断結果":"診断結果"}</div>
    <h1 class="big">${above
      ? `いまの年収は<em>水準を上回っています</em>`
      : `あと <em class="amt">${diff}</em><em>万円</em>、上げられます`}</h1>

    <div class="dist">
      <h2>${esc(JOB_LABEL[st.job])}・${esc({20:"20代",30:"30代",40:"40代",50:"50代〜"}[st.age])}の年収分布と、あなたの位置</h2>
      <div class="bars">${bands.map(([lo,hi,l],i)=>
        `<div class="b ${i===myIdx?'me':''}" style="height:${Math.round(heights[i])}%"></div>`).join("")}</div>
      <div class="axis">${bands.map(([,,l])=>`<span>${l}</span>`).join("")}</div>
      <p class="dnote">${above
        ? `同じ業種・年代の中では上位に入ります。いまは条件を選べる立場です。`
        : `同じ業種・年代の推定水準は <b>${fit}万円</b>。あなたはおよそ下位${Math.max(pct,5)}%の位置にいます。`}</p>
    </div>

    <dl class="kpis">
      <div class="kpi"><dt>いまの年収</dt><dd>${bands[myIdx]?bands[myIdx][2]:"—"}<span style="font-size:13px">万円</span></dd></div>
      <div class="kpi ${above?'ok':'up'}"><dt>${above?"評価":"適正年収（推定）"}</dt>
        <dd>${above?"水準クリア":fit+'<span style="font-size:13px">万円</span>'}</dd></div>
    </dl>

    <h2 class="sec-h">いま相談できる転職サービス</h2>
    <p class="sec-s">${esc(JOB_LABEL[st.job])} × ${esc(DIR_LABEL[st.dir])} を軸に選びました</p>
    ${sites.length ? sites.map((s,i)=>`
      <article class="svc ${i===0?'first':''}">
        <div class="svc-top"><span class="svc-rank">${i===0?"いちばん近い":"候補"+(i+1)}</span>
          <h3>${esc(s.name)}</h3></div>
        <p>${esc(s.rs)}</p>
        <a href="${esc(s.affi)}" target="_blank" rel="nofollow noopener"
           data-n="${esc(s.name)}">無料で相談してみる</a>

           条件を変えると別の候補が出ることがあります。</div>`}

    <div class="share"><span>この結果を共有</span>

    <p class="fine">※本ページはアフィリエイト広告(PR)を含みます。<br>
      ※推定年収は国税庁「民間給与実態統計調査」の全産業平均${ALL_INDUSTRY_AVG}万円を基準に、年代・業種・志向の傾向係数を掛け合わせた参考値です。
      業種・職種別の詳細統計は公開資料で数値が確認できなかったため、係数は一般的な相対傾向による推定であり、実際の年収を保証するものではありません。
      分布のグラフは推定水準を中心に置いた目安であり、実測データではありません。</p>
    <div class="foot">運営: <a href="https://clawtech6477.github.io/clawtech-lp/">ClawTech</a></div>`;

  $("stage").style.display="none";
  $("result").classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
  $("result").querySelectorAll(".svc a").forEach((a,i)=>{
    a.addEventListener("click",()=>track("site_click",{site_name:a.dataset.n,rank:i+1}));
  });
  const url=location.href.split("#")[0];
  const txt=above?`同業種・同年代の水準を上回っていました。`:`あと${diff}万円上げられるという結果でした。`;
  $("sx").onclick=()=>open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(txt+" #年収診断")}&url=${encodeURIComponent(url)}`,"_blank");
  $("sl").onclick=()=>open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}`,"_blank");
  $("sc").onclick=async()=>{ try{ await navigator.clipboard.writeText(url); $("sc").textContent="コピーしました"; }catch(e){} };
  $("again").onclick=()=>{ step=0; $("result").classList.remove("on");
                           $("stage").style.display="none"; $("intro").style.display="";
                           renderStep(); window.scrollTo({top:0,behavior:"smooth"}); };
  track("diagnosis_complete",{job:st.job,dir:st.dir,age:st.age,diff});
}

/* 候補の選定は現行のロジックをそのまま使う（dir/job/ageを必須条件にしたうえで単価を加点） */
function pick(cur){
  const isHigh=cur>=600;
  const ready=s=>!String(s.affi).startsWith("#");
  const core=s=>s.tags.dir.includes(st.dir)
    && (s.tags.job.includes("*")||s.tags.job.includes(st.job))
    && s.tags.age.includes(st.age)
    && !(s.tags.income && s.tags.income.includes("high") && !isHigh);
  const dedupe=list=>{const m=new Map();
    for(const s of list){const p=m.get(s.name); if(!p||s.sc>p.sc) m.set(s.name,s);} return [...m.values()];};
  let out=dedupe(SITES.filter(s=>core(s)&&ready(s)).map(s=>({...s,sc:Math.sqrt(s.payout)*0.35+Math.random()*12})))
            .sort((a,b)=>b.sc-a.sc).slice(0,3);
  if(out.length<2){
    const fb=SITES.filter(s=>ready(s)&&s.tags.dir.includes(st.dir)
      &&(s.tags.job.includes("*")||s.tags.job.includes(st.job))
      &&!(s.tags.income&&s.tags.income.includes("high")&&!isHigh)
      &&!out.some(x=>x.name===s.name))
      .map(s=>({...s,sc:Math.sqrt(s.payout)*0.3}));
    out=out.concat(dedupe(fb).sort((a,b)=>b.sc-a.sc).slice(0,3-out.length));
  }
  return out;
}
document.getElementById("start").onclick=()=>{
  document.getElementById("intro").style.display="none";
  document.getElementById("stage").style.display="";
  renderStep();
  window.scrollTo({top:0,behavior:"smooth"});
  track("diagnosis_start",{});
};
